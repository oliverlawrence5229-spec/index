<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Agu+Display&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Agu Display', sans-serif;
            color: #FFFFFF;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .titlebar { background-color: #961D32Fb; width: 300px; height: 25px; display: none; }
        .content { background-color: #1F7035Fb; width: 295px; height: 160px; display: none; padding-left: 5px; }
        .intro { color: #961D32; }
        hr { margin: 0; height: 0px; border: solid 0.9px #961D32; }
        .checkboxItem { display: inline-flex; align-items: center; column-gap: 4px; line-height: 1; cursor: pointer; font-size: 15px; }
        .checkboxItem:not(:last-of-type) { margin-right: 1px; }
        .checkbox { appearance: none; position: relative; width: 20px; height: 20px; border: 1px solid #676770; cursor: pointer; background-color: #961D32d9; border-radius: 1px; }
        .checkbox:checked { border: 1px solid #676770; background-color: #961D32d9; }
        .checkbox:checked::after { content: ""; position: absolute; top: 3px; left: 2px; width: 12px; height: 6px; border-bottom: 2px solid #1F7035; border-left: 2px solid #1F7035; transform: rotate(-45deg); }
        .inputRange { appearance: none; width: 200px; height: 18px; border: 1px solid #676770; border-radius: 1px; background: #961D32d9; cursor: pointer; }
        .inputRange::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 20px; border: 1px solid #676770; border-radius: 1px; background: #1F7035; box-shadow: none; }
        .scrollable { overflow-y: scroll; scrollbar-width: none; }
        .scrollable::-webkit-scrollbar { display: none; }
        .start-button { background-color: #961D32; color: white; padding: 5px 10px; border: none; cursor: pointer; font-size: 15px; margin: 10px 0; border: solid 1px #676770; height: 40px; width: 200px; }
        .farstcontent { background-color: #1F7035Fb; width: 295px; height: 160px; display: block; padding-left: 5px; }
        .debugbox { background: #000000dd; color: #0f0; font-family: monospace; font-size: 11px; padding: 6px; width: 283px; white-space: pre-wrap; line-height: 1.4; }
    </style>
</head>
<body>
<div class="farstcontent">
    <button class="start-button" onclick="startExecution()">click!!</button>
    <p>Once you play AI or online, click the button in play or on the Home Screen</p>
</div>
<div class="titlebar" id="titlebar">
    <div id="ttt" onclick="openwindow()">&nbsp;🎅 Slither.io <span id="realtime"></span></div>
</div>
<input type="range" name="range" value="0.70" min="0.01" max="1.0" step="0.01" id="zzomsec" class="inputRange" style="display: none; margin-top: 17px; width: 215px;"/>
<div id="content" class="content scrollable">
    <div class="intro">ModMenu by Tabemaru</div>
    <hr>
    <label class="checkboxItem"><input type="checkbox" name="checkbox" id="icon" value="選択肢3" class="checkbox" onchange="hide()" />Hide icon</label>
    <label class="checkboxItem"><input type="checkbox" name="checkbox" id="backblack" value="Background-black" class="checkbox" />Background black</label>
    <label class="checkboxItem"><input type="checkbox" name="checkbox" id="NoEffect" value="Noeffect" class="checkbox" />No boost effect(online only)</label>
    <hr>
    <a style="font-size: 13px">Display the document under the titlebar</a>
    <label class="checkboxItem"><input type="checkbox" name="checkbox" id="zoomwhere" value="選択肢4" class="checkbox" />Zoom</label>
    <hr>
    <label class="checkboxItem">
        <input type="checkbox" id="zoomCheckbox" class="checkbox" onchange="toggleSlider()" />
        <span style="line-height: 20px;">Zoom</span>
    </label>
    <input type="range" name="range" value="0.70" min="0.01" max="1.0" step="0.01" id="zzom" class="inputRange" disabled />
    <hr>
    <div class="intro" style="font-size:12px;">DEBUG (live)</div>
    <div class="debugbox" id="debugOutput">Not started yet.</div>
    <button class="start-button" style="height:30px; font-size:12px; width:283px; margin-top:5px;" onclick="showSummary()">Show Summary</button>
    <textarea id="summaryBox" readonly style="width:283px; height:100px; font-family:monospace; font-size:10px; background:#000; color:#0f0; display:none; margin-top:5px;"></textarea>
</div>
<script>
let baseAddress = null;
let zoomLocker = null;
let zoom2Locker = null;
let freezeLocker = null;
let effectLocker = null;
let clockInterval = null;

let debugWriteCount = 0;
let debugLastValue = null;
let debugLastAddr = null;
let debugWriteRate = 0;
let debugStartTime = null;
let debugMinRate = null;
let debugMaxRate = null;
let debugLastCount = 0;
let debugRateHistory = [];
let debugValueHistory = [];

function updateDebug() {
    const el = document.getElementById('debugOutput');
    if (!baseAddress) {
        el.textContent = 'Not started yet.';
        return;
    }
    const elapsed = ((Date.now() - debugStartTime) / 1000).toFixed(1);
    const rate = elapsed > 0 ? (debugWriteCount / elapsed).toFixed(1) : '0';
    const instantRate = (debugWriteCount - debugLastCount) * 4;
    debugLastCount = debugWriteCount;
    if (instantRate > 0) {
        if (debugMinRate === null || instantRate < debugMinRate) debugMinRate = instantRate;
        if (debugMaxRate === null || instantRate > debugMaxRate) debugMaxRate = instantRate;
        debugRateHistory.push(instantRate);
        if (debugRateHistory.length > 200) debugRateHistory.shift();
    }
    if (debugLastValue !== null) {
        debugValueHistory.push(debugLastValue);
        if (debugValueHistory.length > 200) debugValueHistory.shift();
    }
    el.textContent =
        'baseAddress: ' + baseAddress + '\\n' +
        'zoom addr:   0x' + (debugLastAddr || '?') + '\\n' +
        'zoom value:  ' + (debugLastValue !== null ? debugLastValue : '?') + '\\n' +
        'rate now:    ' + instantRate + '/s\\n' +
        'rate avg:    ' + rate + '/s\\n' +
        'total writes:' + debugWriteCount + '\\n' +
        'elapsed:     ' + elapsed + 's';
}
setInterval(updateDebug, 250);

function showSummary() {
    const box = document.getElementById('summaryBox');
    const elapsed = ((Date.now() - debugStartTime) / 1000).toFixed(1);
    const avgRate = (debugWriteCount / (elapsed > 0 ? elapsed : 1)).toFixed(1);
    let valueChanges = 0;
    for (let i = 1; i < debugValueHistory.length; i++) {
        if (debugValueHistory[i] !== debugValueHistory[i-1]) valueChanges++;
    }
    const summary =
        'SESSION SUMMARY\\n================\\n' +
        'baseAddress: ' + baseAddress + '\\n' +
        'zoom addr: 0x' + (debugLastAddr || '?') + '\\n' +
        'elapsed: ' + elapsed + 's\\n' +
        'total writes: ' + debugWriteCount + '\\n' +
        'avg rate: ' + avgRate + '/s\\n' +
        'min rate seen: ' + (debugMinRate || 0) + '/s\\n' +
        'max rate seen: ' + (debugMaxRate || 0) + '/s\\n' +
        'recent rate samples: ' + debugRateHistory.slice(-20).join(', ') + '\\n' +
        'recent zoom values: ' + debugValueHistory.slice(-20).join(', ') + '\\n' +
        'value changes in last 200: ' + valueChanges;
    box.value = summary;
    box.style.display = 'block';
    box.focus();
    box.select();
}

function updateTime() {
    const ttt = document.getElementById("ttt");
    const content = document.getElementById('content');
    const isVisible = content.style.display === 'block';
    const nowTime = new Date();
    const nowHour = nowTime.getHours().toString().padStart(2, '0');
    const nowMin = nowTime.getMinutes().toString().padStart(2, '0');
    const month = (nowTime.getMonth() + 1).toString().padStart(2, '0');
    const day = nowTime.getDate().toString().padStart(2, '0');
    const timeString = + month + "/" + day + "&nbsp" + nowHour + ":" + nowMin;
    ttt.innerHTML = isVisible ? "&nbsp;🎅&nbsp;Slither.io " + timeString : "&nbsp;🫎&nbsp;Slither.io " + timeString;
}

function openwindow() {
    const content = document.getElementById('content');
    const isVisible = content.style.display === 'block';
    content.style.display = isVisible ? 'none' : 'block';
    setWindowRect(500, 60, 300, isVisible ? 80 : 420);
}

if (clockInterval === null) { clockInterval = setInterval(updateTime, 1000); }

function toggleSlider() {
    const zoomCheckbox = document.getElementById('zoomCheckbox');
    document.getElementById('zzom').disabled = !zoomCheckbox.checked;
    if (!zoomCheckbox.checked && zoomLocker) { clearInterval(zoomLocker); zoomLocker = null; }
}

function startExecution() {
    h5gg.clearResults();
    h5gg.searchNumber('-1', 'F64', '0x000000000', '0x290000000');
    h5gg.searchNearby('411', 'F64', '0x8');
    let results = h5gg.getResults(1, 0);
    if (results.length > 0) {
        baseAddress = results[0].address;
    } else {
        h5gg.clearResults();
        h5gg.searchNumber('-1', 'F64', '0x000000000', '0x290000000');
        h5gg.searchNearby('430', 'F64', '0x8');
        results = h5gg.getResults(1, 0);
        if (results.length > 0) { baseAddress = results[0].address; }
    }
    debugStartTime = Date.now();
    const titlebar = document.getElementById('titlebar');
    const content = document.getElementById('content');
    titlebar.style.display = baseAddress ? 'block' : 'none';
    content.style.display = baseAddress ? 'block' : 'none';
    if (baseAddress) {
        document.querySelector('.start-button').style.display = 'none';
        document.querySelector('.farstcontent').style.display = 'none';
        setWindowRect(500, 60, 300, 420);
        setWindowDrag(0, 0, 300, 25);
    }
}

document.getElementById('backblack').addEventListener('change', function() {
    if (this.checked) {
        if (baseAddress !== null) {
            const black = (parseInt(baseAddress, 16) - 0x150).toString(16);
            const black2 = (parseInt(baseAddress, 16) - 0x140).toString(16);
            freezeLocker = setInterval(function() { h5gg.setValue('0x' + black, 0, 'F64'); h5gg.setValue('0x' + black2, 0, 'F64'); }, 100);
        }
    } else {
        if (freezeLocker !== null) { clearInterval(freezeLocker); freezeLocker = null; }
    }
});

document.getElementById('NoEffect').addEventListener('change', function() {
    if (this.checked) {
        if (baseAddress !== null) {
            const effect = (parseInt(baseAddress, 16) - 0x1c8).toString(16);
            effectLocker = setInterval(function() { h5gg.setValue('0x' + effect, 1000000, 'F64'); }, 250);
        }
    } else {
        if (effectLocker !== null) { clearInterval(effectLocker); effectLocker = null;
            const effect = (parseInt(baseAddress, 16) - 0x1c8).toString(16);
            h5gg.setValue('0x' + effect, 5.39, 'F64');
        }
    }
});

document.getElementById('zoomwhere').addEventListener('change', function() {
    const zzom2 = document.getElementById('zzomsec');
    zzom2.style.display = this.checked ? 'inline-block' : 'none';
});

function zoome2() {
    let slidersec = parseFloat(document.getElementById("zzomsec").value);
    let baseAddressNum = parseInt(baseAddress, 16);
    let zoom = baseAddressNum - 0x260;
    if (!isNaN(zoom)) {
        const addrHex = (zoom).toString(16);
        h5gg.setValue("0x" + addrHex, slidersec, 'F64');
        debugWriteCount++;
        debugLastValue = slidersec;
        debugLastAddr = addrHex;
    }
}

function zoome() {
    let slider = parseFloat(document.getElementById("zzom").value);
    let baseAddressNum = parseInt(baseAddress, 16);
    let zoom = baseAddressNum - 0x260;
    if (!isNaN(zoom)) {
        const addrHex = (zoom).toString(16);
        h5gg.setValue("0x" + addrHex, slider, 'F64');
        debugWriteCount++;
        debugLastValue = slider;
        debugLastAddr = addrHex;
    }
}

function showClock() {
    let realtimeElement = document.getElementById("realtime");
    if (realtimeElement) {
        let nowTime = new Date();
        let nowHour = nowTime.getHours().toString().padStart(2, '0');
        let nowMin = nowTime.getMinutes().toString().padStart(2, '0');
        let nowSec = nowTime.getSeconds().toString().padStart(2, '0');
        realtimeElement.innerHTML = nowHour + ":" + nowMin + ":" + nowSec;
    }
}
setInterval(showClock, 1000);

function hide() {
    const hideicon = document.getElementById('icon');
    if (hideicon.checked) {
        setButtonImage("https://raw.githubusercontent.com/YUPA-TT/HTML-JavaScript-CSS/refs/heads/main/IMG_0244.png");
    } else {
        setButtonImage("https://raw.githubusercontent.com/YUPA-TT/HTML-JavaScript-CSS/refs/heads/main/3_20240828162441.png");
    }
}

setWindowRect(500, 60, 300, 420);
setWindowDrag(0, 0, 300, 25);
document.getElementById('zzomsec').addEventListener('input', zoome2);
document.getElementById('zzom').addEventListener('input', zoome);
document.getElementById('zoomCheckbox').addEventListener('change', toggleSlider);
</script>
</body>
</html>
